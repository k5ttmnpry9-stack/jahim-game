<title>جحيم الدولاب</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;700;800&display=swap">
<style>
/* Layout: full-bleed night street canvas, HUD pinned to the top, joystick and action button in the bottom corners, dialog and puzzle panels float above. */
:root{
  --ink:#14122b; --night:#1f2150; --gold:#f4b43a; --red:#d84b3f; --paper:#fff6df; --mint:#58d6a4; --panel:#241f4a;
  --font-d:'Lalezar','Tajawal',system-ui,sans-serif; --font-b:'Tajawal',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--font-b);font-size:16px;overflow:hidden;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  touch-action:none;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.fx{position:fixed;left:0;right:0;pointer-events:none}
#hud{top:calc(env(safe-area-inset-top,0px) + 8px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
#task{background:rgba(20,18,43,.82);border:1px solid #ffffff30;border-radius:12px;padding:8px 12px;max-width:min(300px,62vw);font-size:12px;line-height:1.5}
#task b{color:var(--gold);font-family:var(--font-d);font-weight:400;font-size:16px;display:block}
#bag{display:flex;gap:6px}
#bag canvas{background:rgba(20,18,43,.82);border:1px solid #ffffff30;border-radius:8px;width:30px;height:30px}
#joy{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:120px;height:120px;border-radius:50%;background:#ffffff14;border:2px solid #ffffff3a;touch-action:none}
#knob{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:#ffffff55}
#act{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 34px);min-width:92px;height:92px;border-radius:50%;border:3px solid var(--gold);background:#f4b43a33;color:var(--paper);font:400 20px var(--font-d);cursor:pointer;padding:0 8px}
#act.on{background:var(--gold);color:var(--ink)}
#act small{display:block;font:700 11px var(--font-b);opacity:.9;max-width:90px;margin:0 auto}
#dlg{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 122px);width:min(290px,70vw);background:#241f4af2;border:1.5px solid var(--gold);border-radius:12px;padding:8px 10px;display:none;z-index:5}
#dlg .who{font:400 14px var(--font-d);color:var(--gold)}
#dlg .tx{font-size:13px;line-height:1.55;min-height:2em}
#dlg .ch{display:flex;flex-direction:column;gap:6px;margin-top:6px}
#dlg .btn{font-size:13px;padding:7px 10px}
#run{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:34%;width:56px;height:56px;border-radius:50%;border:2px solid var(--mint);background:#58d6a41a;color:var(--paper);font:400 15px var(--font-d);touch-action:none;cursor:pointer;padding:0}
#run.on{border-color:var(--gold)}
#money{background:rgba(20,18,43,.82);border:1px solid #ffffff30;border-radius:10px;padding:4px 10px;font:400 14px var(--font-d);color:var(--gold)}
.side{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.btn{font:800 16px var(--font-b);background:var(--gold);color:var(--ink);border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
.btn.alt{background:#ffffff1f;color:var(--paper)}
.btn:focus-visible,#act:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
#ov{position:fixed;inset:0;background:#0c0b1fe6;display:none;z-index:8;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 14px)}
#ovin{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
#ovin h2{font:400 26px var(--font-d);margin:0;color:var(--gold);text-wrap:balance}
#ovin p{margin:0;line-height:1.7}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr}
.pad .btn{font-size:22px;padding:14px 0}
.code{display:flex;gap:8px;justify-content:center;direction:ltr}
.code span{width:52px;height:64px;border:2px solid var(--gold);border-radius:10px;display:grid;place-items:center;font:400 34px var(--font-d);background:#00000040}
.grid5{display:grid;gap:6px;direction:ltr;margin:0 auto}
.cell{aspect-ratio:1;border-radius:8px;border:2px solid #ffffff30;background:#2a2d5a;cursor:pointer;width:100%}
.cell.on{background:var(--gold);box-shadow:0 0 14px #f4b43a99}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:300px;margin:0 auto;width:100%}
.simon button{aspect-ratio:1.3;border-radius:16px;border:0;opacity:.55;cursor:pointer}
.simon button.lit{opacity:1;filter:brightness(1.4);box-shadow:0 0 22px #fff8}
.lineup{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px}
.lineup button{background:#ffffff14;border:2px solid #ffffff30;border-radius:12px;color:var(--paper);padding:6px;font:700 13px var(--font-b);cursor:pointer}
.lineup canvas{width:100%;height:auto;display:block}
.note{background:var(--paper);color:#2a2540;border-radius:10px;padding:10px 12px;line-height:1.7;font-weight:700}
#toast{position:fixed;left:50%;top:30%;transform:translateX(-50%);background:var(--gold);color:var(--ink);font:400 20px var(--font-d);padding:8px 18px;border-radius:12px;opacity:0;transition:opacity .25s;z-index:9;pointer-events:none;text-align:center;max-width:86vw}
#fade{position:fixed;inset:0;background:#000;opacity:0;transition:opacity .6s;pointer-events:none;z-index:7;display:grid;place-items:center;text-align:center;padding:24px;font:400 26px var(--font-d);color:var(--paper)}
#start{position:fixed;inset:0;background:radial-gradient(circle at 50% 20%,#3a2f78,#14122b 70%);z-index:10;overflow:auto;touch-action:pan-y}
#sin{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 20px)}
#start h1{font:400 clamp(44px,13vw,80px)/1 var(--font-d);margin:0;color:var(--gold);text-wrap:balance}
#start p{max-width:30em;margin:0;line-height:1.7;opacity:.9;font-size:14px}
#pv{width:170px;height:200px;border-radius:16px;background:linear-gradient(#2d2a62,#1a1840);border:2px solid #ffffff30}
.grp{width:100%;display:flex;flex-direction:column;gap:6px;align-items:center}
.grp h3{margin:0;font:400 17px var(--font-d);color:var(--gold)}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font:700 13px var(--font-b);padding:7px 11px;border-radius:10px;border:1.5px solid #ffffff30;background:#ffffff14;color:var(--paper);cursor:pointer}
.chip.sel{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid #ffffff30;cursor:pointer;padding:0}
.sw.sel{border-color:var(--gold);box-shadow:0 0 0 2px #14122b,0 0 0 4px var(--gold)}
.chip:focus-visible,.sw:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#fade,#toast{transition:none}}
</style>
<canvas id="cv"></canvas>
<div id="hud" class="fx"><div id="task"><b>المهمة</b><span id="tt"></span></div><div class="side"><div id="money"></div><div id="bag"></div></div></div>
<div id="dlg"><div class="who" id="dwho"></div><div class="tx" id="dtx"></div><div class="ch" id="dch"></div></div>
<div id="joy"><div id="knob"></div></div>
<button id="run" type="button">جري</button>
<button id="act" type="button">تفاعل</button>
<div id="ov"><div id="ovin"></div></div>
<div id="toast"></div>
<div id="fade"></div>
<div id="start"><div id="sin">
  <h1>جحيم الدولاب</h1>
  <p>اختر شكلك قبل ما تبدأ: الملابس، الشورتات، الشعر، الحواجب، الشنب والدقن.</p>
  <canvas id="pv" width="340" height="400"></canvas>
  <div class="grp"><h3>الملابس</h3><div class="row" id="gOut"></div></div>
  <div class="grp"><h3>لون القميص</h3><div class="row" id="gCl"></div></div>
  <div class="grp"><h3>السفلي</h3><div class="row" id="gLw"></div></div>
  <div class="grp"><h3>لون السفلي</h3><div class="row" id="gPn"></div></div>
  <div class="grp"><h3>الشعر</h3><div class="row" id="gHs"></div></div>
  <div class="grp"><h3>لون الشعر</h3><div class="row" id="gHc"></div></div>
  <div class="grp"><h3>الحواجب</h3><div class="row" id="gBr"></div></div>
  <div class="grp"><h3>الشنب</h3><div class="row" id="gMu"></div></div>
  <div class="grp"><h3>الدقن</h3><div class="row" id="gBd"></div></div>
  <div class="grp"><h3>لون البشرة</h3><div class="row" id="gSk"></div></div>
  <button class="btn" id="go" type="button" style="margin-top:6px;font-size:20px;padding:12px 40px">ابدأ اللعب</button>
  <p style="font-size:12px;opacity:.7">الحركة: العصا يسار. التفاعل: الزر الذهبي يمين. الجري: الزر الأخضر الصغير. أو الأسهم ومسافة.</p>
</div></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'),c=cv.getContext('2d');
let VW=0,VH=0,DPR=1,Z=1.5;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);VW=window.innerWidth;VH=window.innerHeight;cv.width=VW*DPR;cv.height=VH*DPR;Z=Math.max(1.15,Math.min(1.8,VW/500));}
window.addEventListener('resize',resize);resize();

/* ---------- helpers ---------- */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rnd(s){s=Math.sin(s*127.1+311.7)*43758.5453;return s-Math.floor(s);}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function txt(g,t,x,y,size,col,font){g.fillStyle=col;g.font=(font||'400')+' '+size+'px Lalezar,Tajawal,sans-serif';g.textAlign='center';g.textBaseline='middle';g.direction='rtl';g.fillText(t,x,y);}

/* ---------- people ---------- */
function faceFx(g,o,hy,sh){
  const c=o.hr||'#222';g.fillStyle=c;g.strokeStyle=c;g.lineCap='round';
  const bd=o.bd||(o.beard?'short':'none');
  if(bd==='stubble'){g.globalAlpha=.4;g.beginPath();g.arc(0,hy+2.6,6.4,.05*Math.PI,.95*Math.PI);g.fill();g.globalAlpha=1;}
  else if(bd==='short'){g.beginPath();g.arc(0,hy+2.6,5.8,.08*Math.PI,.92*Math.PI);g.fill();}
  else if(bd==='full'){g.beginPath();g.arc(0,hy+1.4,7.2,.02*Math.PI,.98*Math.PI);g.fill();g.fillRect(-7.2,hy-1,2,4);g.fillRect(5.2,hy-1,2,4);}
  else if(bd==='goatee'){g.beginPath();g.ellipse(sh*.5,hy+5.2,2.6,3,0,0,TAU);g.fill();}
  else if(bd==='long'){g.beginPath();g.arc(0,hy+1.4,7,.02*Math.PI,.98*Math.PI);g.fill();g.beginPath();g.ellipse(0,hy+8,4.6,7,0,0,TAU);g.fill();}
  const mu=o.mu||'none';
  if(mu!=='none'){g.lineWidth=.9;
    if(mu==='thin'){g.beginPath();g.moveTo(-3.6+sh,hy+1.4);g.quadraticCurveTo(sh,hy+.2,3.6+sh,hy+1.4);g.stroke();}
    else if(mu==='pencil'){g.lineWidth=.5;g.beginPath();g.moveTo(-3+sh,hy+1.3);g.lineTo(3+sh,hy+1.3);g.stroke();}
    else{g.beginPath();g.ellipse(sh,hy+1.5,3.9,1.3,0,0,TAU);g.fill();
      if(mu==='handlebar'){g.lineWidth=1;g.beginPath();g.moveTo(-3.6+sh,hy+1.6);g.quadraticCurveTo(-6.2+sh,hy+2.2,-6+sh,hy-.2);g.moveTo(3.6+sh,hy+1.6);g.quadraticCurveTo(6.2+sh,hy+2.2,6+sh,hy-.2);g.stroke();}}
  }
  const br=o.br||'normal';
  if(br!=='none'){g.lineWidth=br==='thick'?1.9:br==='thin'?.6:1.1;
    [-1,1].forEach(sd=>{const ix=sd*1.2+sh,ox=sd*4.4+sh;let iy=hy-3.4,oy=hy-3.4;if(br==='angry'){iy=hy-2.3;oy=hy-4.5;}
      g.beginPath();g.moveTo(ix,iy);if(br==='raised')g.quadraticCurveTo((ix+ox)/2,hy-6.2,ox,hy-3.8);else g.lineTo(ox,oy);g.stroke();});}
}
function drawPerson(g,x,y,o,ph,dir,mv){
  const k=o.k||1,sw=Math.sin(ph||0)*(mv?4.6:0),bob=mv?-Math.abs(Math.cos(ph||0))*1.8:Math.sin((window.__T||0)*2.2+k*9)*.45;
  g.save();g.translate(x,y);g.scale(k*(o.wide||1),k);
  g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(0,1,10,4,0,0,TAU);g.fill();
  g.translate(0,bob);
  const long=o.fit==='thobe'||o.fit==='abaya';
  if(long){
    g.fillStyle=o.cl;g.beginPath();g.moveTo(-8,-24);g.lineTo(-10.5+sw*.15,-1.5);g.lineTo(10.5+sw*.15,-1.5);g.lineTo(8,-24);g.closePath();g.fill();
    g.fillStyle='#1b1b1b';g.fillRect(-7+sw*.5,-2.5-Math.max(0,sw)*.4,5,3);g.fillRect(2-sw*.5,-2.5-Math.max(0,-sw)*.4,5,3);
  }else{
    if(o.shorts){g.fillStyle=o.sk;g.fillRect(-6,-12,5.6,11-Math.max(0,sw));g.fillRect(.4,-12,5.6,11-Math.max(0,-sw));g.fillStyle=o.pn||'#2b3a55';g.fillRect(-6.5,-21,6.5,10);g.fillRect(0,-21,6.5,10);}
    else{g.fillStyle=o.pn||'#2b3a55';
    g.fillRect(-6,-21,5.6,20-Math.max(0,sw));g.fillRect(.4,-21,5.6,20-Math.max(0,-sw));}
    g.fillStyle='#1b1b1b';g.fillRect(-7,-2-Math.max(0,sw),6.8,3);g.fillRect(.2,-2-Math.max(0,-sw),6.8,3);
  }
  g.fillStyle=o.cl;rr(g,-8.5,-35,17,16,4);g.fill();
  if(o.fit==='suit'){
    g.fillStyle='#f2f2f2';g.beginPath();g.moveTo(-3,-35);g.lineTo(3,-35);g.lineTo(0,-24);g.closePath();g.fill();
    g.fillStyle=o.tie||'#c33';g.beginPath();g.moveTo(-1.3,-33);g.lineTo(1.3,-33);g.lineTo(2,-26);g.lineTo(0,-23);g.lineTo(-2,-26);g.closePath();g.fill();
  }
  if(o.kit){const c2=o.kit.c2,ks=o.kit.s;g.save();rr(g,-8.5,-35,17,16,4);g.clip();g.strokeStyle=c2;g.fillStyle=c2;g.lineWidth=2;
    if(ks==='sides'){g.fillRect(-8.5,-35,2.4,16);g.fillRect(6.1,-35,2.4,16);}
    else if(ks==='swirl'){g.lineWidth=1.8;g.beginPath();g.arc(-3,-27,6,.2,4.2);g.stroke();g.beginPath();g.arc(-3,-27,3,.8,5);g.stroke();g.beginPath();g.arc(3,-23,6,3.4,6.3);g.stroke();}
    g.restore();g.strokeStyle=c2;g.lineWidth=2.4;g.beginPath();g.moveTo(-5.5,-35);g.quadraticCurveTo(0,-29.5,5.5,-35);g.stroke();}
  if(o.pic&&o.pic.complete&&o.pic.naturalWidth){g.save();rr(g,-8,-34.5,16,15,3);g.clip();{const r=o.pic.naturalWidth/o.pic.naturalHeight,w=r>1?15:15*r,hh=r>1?15/r:15;g.drawImage(o.pic,-w/2,-26.5-hh/2,w,hh);}g.restore();}
  if(o.cape){g.fillStyle=o.cape;g.beginPath();g.moveTo(-9,-36);g.lineTo(9,-36);g.lineTo(13,-9);g.lineTo(-13,-9);g.closePath();g.fill();g.fillStyle='#ffffff';g.fillRect(-9,-17,16,1.6);g.fillRect(-8,-18.6,3,1.2);g.fillStyle='#ffffff99';for(let i=0;i<6;i++)g.fillRect(-9+i*3,-28,1.6,4+(i%2)*2);}
  if(o.fit==='thobe'){g.fillStyle='#00000022';g.fillRect(-.6,-34,1.2,10);}
  g.fillStyle=o.cl;rr(g,-12.5,-34+sw*.6,4.2,14,2);g.fill();rr(g,8.3,-34-sw*.6,4.2,14,2);g.fill();
  g.fillStyle=o.hd==='niqab'?'#111':o.sk;g.beginPath();g.arc(-10.4,-19.5+sw*.6,2.3,0,TAU);g.arc(10.4,-19.5-sw*.6,2.3,0,TAU);g.fill();
  const hy=-41,sh=dir===1?-1.6:dir===2?1.6:0;
  if(o.hd==='niqab'){
    g.fillStyle='#0e0e12';g.beginPath();g.arc(0,hy,8.4,0,TAU);g.fill();
    g.beginPath();g.moveTo(-10,-35);g.quadraticCurveTo(0,-30,10,-35);g.lineTo(9,-30);g.lineTo(-9,-30);g.closePath();g.fill();
    if(dir!==3){g.fillStyle=o.sk;rr(g,-5.2+sh,hy-2.2,10.4,3,1.5);g.fill();g.fillStyle='#111';g.beginPath();g.arc(-2.4+sh,hy-.7,.9,0,TAU);g.arc(2.4+sh,hy-.7,.9,0,TAU);g.fill();}
  }else{
    g.fillStyle=o.sk;g.beginPath();g.arc(0,hy,7,0,TAU);g.fill();
    if(o.hd==='hair'){
      g.fillStyle=o.hr;const hs=o.hs||'short';
      if(hs==='curly'){for(let i=0;i<7;i++){g.beginPath();g.arc(-6+i*2,hy-5.5+Math.abs(i-3)*.9,3.4,0,TAU);g.fill();}g.beginPath();g.arc(0,hy-2,7,Math.PI*1.05,Math.PI*1.95);g.fill();}
      else if(hs==='spiky'){g.beginPath();for(let i=0;i<5;i++){g.moveTo(-7+i*3.5,hy-4);g.lineTo(-5.2+i*3.5,hy-11.5-(i%2)*2);g.lineTo(-3.5+i*3.5,hy-4);}g.fill();g.beginPath();g.arc(0,hy-.6,7.3,Math.PI*1.05,Math.PI*1.95);g.fill();}
      else if(hs==='long'){g.beginPath();g.arc(0,hy-.6,7.6,Math.PI*1.02,Math.PI*1.98);g.fill();rr(g,-9.6,hy-4,4,22,2);g.fill();rr(g,5.6,hy-4,4,22,2);g.fill();}
      else if(hs==='ponytail'){g.beginPath();g.arc(0,hy-.6,7.5,Math.PI*1.02,Math.PI*1.98);g.fill();g.beginPath();g.ellipse(9.5,hy+3,2.8,7,-.25,0,TAU);g.fill();g.fillStyle='#e0457a';g.fillRect(7.4,hy-3,4,2);g.fillStyle=o.hr;}
      else if(hs==='bun'){g.beginPath();g.arc(0,hy-.6,7.5,Math.PI*1.02,Math.PI*1.98);g.fill();g.beginPath();g.arc(0,hy-10,3.8,0,TAU);g.fill();}
      else if(hs==='braid'){g.beginPath();g.arc(0,hy-.6,7.5,Math.PI*1.02,Math.PI*1.98);g.fill();for(let i=0;i<5;i++){g.beginPath();g.ellipse(-8.6+(i%2)*.8,hy+2+i*3.6,2.2,2.2,0,0,TAU);g.fill();}}
      else if(hs==='bob'){g.beginPath();g.arc(0,hy-.6,7.8,Math.PI*1.02,Math.PI*1.98);g.fill();rr(g,-9,hy-4,4,11,2);g.fill();rr(g,5,hy-4,4,11,2);g.fill();}
      else if(hs==='bald'){}

};
Q.leaveShop=()=>{
  if(stage<2&&st.basket.length===0){toast('لسا ما اشتريت شي');}
  goScene('street',2335,700);
  if(st.flags.errandDone&&!st.flags.robbed){setTask('ارجع لبيتك (غرب الحارة، أول بيت).');return;}
  setTask(stage>=3?'روح شقة ٧ في عمارة الأبراج (جنوب غرب الحارة).':stage>=2?'روح مركز الشرطة وبلّغ.':'ارجع لبنده واشتر الأغراض.');
};

/* ---------- 3. police lineup ---------- */
const SUS=[
  {n:'أ',o:{sk:'#ead9cc',hr:'#777',fit:'suit',cl:'#1a1a22',pn:'#15151c',tie:'#c3222a',hd:'hair',gl:true}},
  {n:'ب',o:{sk:'#ead9cc',hr:'#0c0c0c',fit:'suit',cl:'#1a1a22',pn:'#15151c',tie:'#2a52c3',hd:'hair',gl:true}},
  {n:'ج',o:{sk:'#ead9cc',hr:'#0c0c0c',fit:'suit',cl:'#1a1a22',pn:'#15151c',tie:'#c3222a',hd:'hair',gl:false}},
  {n:'د',o:{sk:'#ead9cc',hr:'#0c0c0c',fit:'shirt',cl:'#555e6a',pn:'#2b3a55',hd:'hair',gl:true}},
  {n:'هـ',o:{sk:'#ead9cc',hr:'#0c0c0c',fit:'suit',cl:'#1a1a22',pn:'#15151c',tie:'#c3222a',hd:'hair',gl:true}}
];
const ORD=[3,0,4,2,1];
Q.officer=()=>{
  if(stage<2){say([['الضابط','أهلاً. لو صار شي بلّغنا.']]);return;}
  if(stage===3){
    say([['أنت','ها بشروني، وش صار؟'],['الضابط','للحين ما وصلنا على شي.'],['أنت','لا حول ولا قوة إلا بالله.']],()=>{
      stage=4;setTask('ابدأ التحقيق بنفسك. ٤ أدلة: شقة ٧ (عمارة الأبراج)، الصيدلية، أسواق التميمي، وورقة على الدكة في الحديقة.');
      say([['أنت','ما راح أنتظر. بحقق بنفسي، وأحل كل لغز لين ألقاهم.']]);
    });return;
  }
  if(stage>=4){say([['الضابط','الله يعينك في التحقيق. لو لقيت شي بلّغنا.']]);return;}
  say([['الضابط','الحمد لله على سلامتك. نبي نعرف شكله: الشاهد سمع أنه لابس بدلة، ولابس نظارة سوداء، وربطة عنقه حمراء، وشعره أسود. اختر من الصف.']],()=>lineup());
};
function lineup(){
  openOv(b=>{
    b.appendChild(mk('h2','','صف التعرّف'));
    const cl=mk('div','note','الشاهد قال: ١) لابس بدلة. ٢) لابس نظارة سوداء. ٣) ربطة عنقه حمراء. ٤) شعره أسود. اختر الشخص الوحيد اللي ينطبق عليه كل شي.');
    b.appendChild(cl);
    const grid=mk('div','lineup');
    ORD.forEach(i=>{
      const s=SUS[i],btn=document.createElement('button'),k=document.createElement('canvas');k.width=120;k.height=150;
      const g=k.getContext('2d');g.fillStyle='#d8d3c4';g.fillRect(0,0,120,150);g.fillStyle='#bdb8a8';g.fillRect(0,120,120,30);
      for(let h=0;h<5;h++){g.fillStyle='#0002';g.fillRect(0,28+h*18,120,1);}
      g.save();g.translate(60,126);g.scale(2.1,2.1);drawPerson(g,0,0,Object.assign({k:1},s.o),0,0);g.restore();
      btn.appendChild(k);btn.appendChild(document.createTextNode('رقم '+s.n));
      btn.onclick=()=>{
        if(i===4){closeOv();
          say([['الضابط','هذا هو! الحمد لله على سلامتك. يصير خير، وإن شاء الله نحاول نجيبهم.'],['أنت','جزاكم الله خير.']],()=>{
            fade('بعد أسابيع…',()=>{stage=3;},()=>{setTask('مرّت أسابيع. روح مركز الشرطة واسألهم وش صار في القضية.');},2200);
          });}
        else toast('مو هو، راجع كلام الشاهد');
      };
      grid.appendChild(btn);
    });
    b.appendChild(grid);b.appendChild(mk('button','btn alt','رجوع',closeOv));
  });
}

/* ---------- 4. apartment: breaker, TV memory, fridge note, safe ---------- */
Q.towerDoor=()=>{
  if(stage<4){toast('الباب مقفل');return;}
  door('apt',400,480);
  setTask('داخل الشقة ٧: الكهرباء مقطوعة. (١) صندوق الكهرباء، (٢) التلفزيون، (٣) ورقة الثلاجة، (٤) الخزنة.');
  say([['الشاهد','أنا ما قدرت أمسك الأدلة، الكهرباء قطعوها. الأدلة في الخزنة، ورمزها ٦ أرقام. شغّل الكهرباء أول.']]);
};
Q.breaker=()=>{
  if(st.power){toast('الكهرباء شغّالة');return;}
  openOv(b=>{
    const N=5,a=new Array(N*N).fill(0);
    const press=i=>{const x=i%N,y=Math.floor(i/N);[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{const xx=x+d[0],yy=y+d[1];if(xx>=0&&yy>=0&&xx<N&&yy<N)a[yy*N+xx]^=1;});};
    const used=new Set();while(used.size<12)used.add(Math.floor(Math.random()*25));used.forEach(press);
    if(a.reduce((s,v)=>s+v,0)<5)press(12);
    b.appendChild(mk('h2','','صندوق الكهرباء'));
    b.appendChild(mk('p','','المفاتيح المضيئة تعني دائرة معطّلة. كل ضغطة تقلب المفتاح والأربعة اللي حواليه. أطفئ كل المفاتيح.'));
    const grid=mk('div','grid5');grid.style.gridTemplateColumns='repeat(5,1fr)';grid.style.maxWidth='340px';grid.style.width='100%';
    const cells=[];
    const paint=()=>cells.forEach((e,i)=>e.className='cell'+(a[i]?' on':''));
    for(let i=0;i<N*N;i++){const e=mk('button','cell','',()=>{press(i);paint();if(a.every(v=>!v)){closeOv();st.power=true;toast('رجعت الكهرباء!');setTask('الكهرباء شغّالة. افحص التلفزيون وورقة الثلاجة، ثم افتح الخزنة.');}});cells.push(e);grid.appendChild(e);}
    paint();b.appendChild(grid);b.appendChild(mk('button','btn alt','رجوع',closeOv));
  });
};
Q.tv=()=>{
  if(!st.power){toast('ما فيه كهرباء');return;}
  if(st.flags.tvOn){say([['التلفزيون','على الشاشة أرقام: '+ar(st.flags.tvCode)+'  (الجزء الأول من رمز الخزنة)']]);return;}
  const cols=['#e24f4f','#4f8be2','#4fe28a','#f4b43a'];
  openOv(b=>{
    const seq=[];for(let i=0;i<7;i++)seq.push(Math.floor(Math.random()*4));
    let pos=0,busy=true;
    b.appendChild(mk('h2','','التلفزيون مقفل بتسلسل'));
    const info=mk('p','','احفظ ٧ ألوان وكرّرها بنفس الترتيب.');b.appendChild(info);
    const wrap=mk('div','simon'),btns=cols.map((col,i)=>{const e=mk('button','',null,()=>tap(i));e.style.background=col;wrap.appendChild(e);return e;});
    b.appendChild(wrap);
    const alive=()=>document.body.contains(wrap);
    const flash=i=>{btns[i].classList.add('lit');setTimeout(()=>btns[i].classList.remove('lit'),420);};
    function play(){busy=true;pos=0;info.textContent='انتبه…';seq.forEach((v,k)=>setTimeout(()=>{if(alive())flash(v);},700+k*650));setTimeout(()=>{if(alive()){busy=false;info.textContent='دورك: كرّر التسلسل.';}},700+seq.length*650);}
    function tap(i){
      if(busy)return;flash(i);
      if(i!==seq[pos]){toast('غلط! انتبه مرة ثانية');busy=true;setTimeout(()=>{if(alive())play();},900);return;}
      pos++;if(pos===seq.length){closeOv();st.flags.tvOn=true;st.flags.tvCode='382';toast('فتح التلفزيون');say([['التلفزيون','ظهرت أرقام على الشاشة: ٣٨٢. تذكّرها، هذا الجزء الأول من رمز الخزنة.']]);}
    }
    b.appendChild(mk('button','btn','شوف التسلسل مرة ثانية',()=>{if(!busy)play();}));
    b.appendChild(mk('button','btn alt','رجوع',closeOv));
    setTimeout(play,300);
  });
};
Q.fridge=()=>{
  say([['ورقة الثلاجة','«الجزء الثاني من رمز الخزنة، ٣ أرقام بالترتيب: ١) أول رقم أولي زوجي × ٣. ٢) عدد أيام الأسبوع. ٣) تسعة − أربعة. والجزء الأول يطلع على التلفزيون.»']]);
};
Q.safe=()=>{
  if(st.flags.cl_apt){toast('فتحتها من قبل');return;}
  keypad('الخزنة','رمز من ٦ أرقام: جزء التلفزيون ثم جزء الثلاجة.',6,'382675',()=>{
    st.flags.done=1;
    say([['أنت','في الخزنة دفتر وخريطة، وعليها دائرة حمراء على محطة قديمة مهجورة!']],()=>gotClue('apt'));
  },b=>{if(!b.querySelector('.hintbox'))b.appendChild(mk('div','note hintbox','تلميح: الجزء الثاني = ٢×٣ ثم ٧ ثم ٥ أي ٦٧٥، والتلفزيون يعطي ٣٨٢.'));});
};
Q.aptDoor=()=>{
  if(!st.flags.done){toast('لسا ما خلصت، افتح الخزنة');return;}
  goScene('street',410,1740);
};
/* ---------- investigation clues ---------- */
const CL=['apt','pharm','market','bench'];
function gotClue(k){
  st.flags['cl_'+k]=1;const n=CL.filter(x=>st.flags['cl_'+x]).length;
  if(n===4){st.flags.stationOpen=1;setTask('كل الأدلة تدل على المحطة المهجورة (جنوب وسط الحارة، قبل مركز الشرطة). روح لها.');}
  else setTask('أدلة '+ar(n)+'/٤. الباقي: '+[['apt','شقة ٧'],['pharm','الصيدلية'],['market','أسواق التميمي'],['bench','ورقة الدكة']].filter(a=>!st.flags['cl_'+a[0]]).map(a=>a[1]).join('، ')+'.');
}
Q.clue=k=>{
  if(stage<4){toast('مقفل');return;}
  if(st.flags['cl_'+k]){say([['أنت','هذا الدليل خذته من قبل.']]);return;}
  if(k==='pharm')say([['الصيدلاني','تعال! الكاميرا سجّلت لصوص دخلوا الصيدلية.']],()=>choiceOv('لغز الصيدلاني','اللصوص دخلوا الساعة ٩:١٢ ثم ٩:٢٧ ثم ٩:٤٢. دخلتهم تتكرر بنفس النمط. متى الدخلة الرابعة؟',['٩:٥٢','٩:٥٧','١٠:٠٢','١٠:١٢'],1,()=>{say([['الصيدلاني','صح! وسمعتهم يتكلمون عن «مكان فيه بنزين قديم».']],()=>gotClue('pharm'));}));
  else if(k==='market')say([['الكاشير','عندي شريط كاميرات قديم، بس مقفل برمز.']],()=>keypad('شريط الكاميرا','الرقم ١: ٣ × ٢. الرقم ٢: مربّع ٣. الرقم ٣: ١٥ − ٨. الرقم ٤: الأول ناقص الثاني زائد الثالث.',4,'6974',()=>{say([['أنت','في الشريط سيارة سودا طالعة جنوب، ناحية المحطة القديمة.']],()=>gotClue('market'));}));
  else if(k==='bench')say([['أنت','ورقة مطوية على الدكة، فيها أرقام.']],()=>choiceOv('ورقة الدكة','١، ١، ٢، ٣، ٥، ٨، ؟ ... والرقم يطلع لك رقم الطريق.',['١٢','١٣','١٤','١٦'],1,()=>{say([['أنت','الطريق ١٣ يمر جنب المحطة المهجورة.']],()=>gotClue('bench'));}));
};
/* ---------- abandoned station fight ---------- */
function stationChoices(){
  return [{t:'أتضارب معهم',fn:()=>{setTask('اضرب العصابة! اقترب واضغط الزر الذهبي (اضرب).');E.startFight();}},
          {t:'أهرب',fn:()=>say([['أنت','أهرب!'],['ملثم','وين رايح؟ ما تقدر تطلع!']],()=>say([['أنت','الباب مسكّر، ما فيه مهرب. لازم أتضارب.']],null,[stationChoices()[0]]))}];
}
Q.station=()=>{
  if(!st.flags.stationOpen){toast('المحطة مقفلة بسلاسل. لازم أدلة أول.');return;}
  fade('دخلت المحطة المهجورة…',()=>{goScene('station',450,500);},()=>{
    say([['ملثم','فيه أحد شافك!'],['ملثم','أنت اللي تدور علينا؟ ما راح تطلع من هنا.']],null,stationChoices());
  },1500);
};
Q.fightLost=()=>{
  fade('ضربوك كثير وسقطت… قمت من جديد!',()=>{E.stopFight();goScene('station',450,500);},()=>{E.startFight();},1600);
};
Q.fightWon=()=>{
  say([['أنت','خلصتهم كلهم!'],['أنت','أخيراً…']],()=>{
    fade('وفجأة غدر فيك واحد منهم من ورا، ضربك بعصا على راسك وسقطت…',()=>{
      const s=E.scene;P.x=450;P.y=430;
      const mkP=o=>Object.assign({sk:'#d9a678',hr:'#222',fit:'suit',cl:'#2a4a2f',pn:'#2a4a2f',hd:'hair',k:1},o||{});
      s.arrest=[];
      s.thugs.forEach((n,i)=>{n.x=[330,450,570][i];n.y=250;n.moving=false;n.dir=0;n.home=null;s.npcs.push(n);s.arrest.push(n);});
      s.cashier=E.npc(s,200,470,{sk:'#8d5a3a',hr:'#0d0d0d',fit:'shirt',cl:'#2e7d4a',pn:'#222',hd:'hair',hs:'short',bd:'full',mu:'thick',br:'thick',k:1.12,wide:1.45,name:'كاشير بنده'},null);
      s.pol=[E.npc(s,330,340,mkP({name:'شرطي'}),null),E.npc(s,570,340,mkP({name:'شرطي'}),null)];
    },()=>{
      const s=E.scene;
      say([['كاشير بنده','بابا! أنا كلام شورطة، عشان أنا خوف على إنتا!'],['الشرطي','أحسنت. هو اللي بلّغنا، ولقيناك هنا مع العصابة. مسكناهم كلهم.'],['أنت','الله يجزاك خير يا بابا، أنقذتني!'],['كاشير بنده','ما في مشكلة بابا، إنتا زبون كويس.']],()=>{
        fade('الشرطة أخذت العصابة للسجن…',()=>{
          s.arrest.forEach(n=>{const i=s.npcs.indexOf(n);if(i>=0)s.npcs.splice(i,1);});
        },()=>{
          say([['الشرطي','رجّعنا لك التلفزيون وفلوسك من العصابة. روح لبيتك وارتّبه.']],()=>{
            fade('رجعت للحارة…',()=>{st.flags.ending=1;st.flags.tidy={};goScene('street',1560,1720);},()=>{setTask('رتّب بيتك (غرب الحارة، أول بيت): التلفزيون، الكرسي، الأدراج، الورق، صندوق الفلوس.');},1600);
          });
        },2200);
      });
    },3000);
  });
};
function finale(){
  st.lock=true;
  fade('اتصلحت الأمور… العصابة في السجن، وبيتك مرتّب، وفلوسك مدسوسة في مكانها. عشت حياة سعيدة.',()=>{},()=>{
    openOv(b=>{b.appendChild(mk('h2','','النهاية'));b.appendChild(mk('p','','عشت حياة سعيدة. شكراً للعب جحيم الدولاب!'));b.appendChild(mk('button','btn','العب من جديد',()=>window.location.reload()));});
  },3200);
}
})();

</script>
